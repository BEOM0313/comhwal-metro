<script>/* 다크 모드 전환 (모든 화면 공통)
   - 처음에는 기기 설정(라이트/다크)을 따르고, 단추를 누르면 그 선택을 기억한다 (localStorage cs_theme)
   - <head>에서 바로 실행해 첫 화면부터 깜빡임 없이 적용
   - 전환할 때 누른 단추에서 원이 퍼지며 바뀐다 (View Transitions, 지원 안 하는 브라우저는 즉시) */
(function(){
'use strict';
var K='cs_theme', root=document.documentElement;
function saved(){try{var v=JSON.parse(localStorage.getItem(K)||'""');return v==='light'||v==='dark'?v:''}catch(e){return ''}}
function sys(){try{return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){return 'light'}}
function eff(){return saved()||sys()}
/* 상태 표시줄 색: 고른 테마의 색을 두 meta 모두에 넣는다 */
function metas(t){
  var ms=document.querySelectorAll('meta[name="theme-color"]');
  for(var i=0;i<ms.length;i++){var m=ms[i];
    if(!m.dataset.orig){m.dataset.orig=m.content;m.dataset.media=m.getAttribute('media')||''}
    var dark=/dark/.test(m.dataset.media), light=/light/.test(m.dataset.media);
    if(!dark&&!light) continue;
    var pick=null; for(var j=0;j<ms.length;j++){var n=ms[j]; if(new RegExp(t).test(n.dataset.media||n.getAttribute('media')||'')) pick=n.dataset.orig||n.content}
    m.content=saved()&&pick?pick:m.dataset.orig;
  }
}
function apply(t){
  if(t) root.setAttribute('data-theme',t); else root.removeAttribute('data-theme');
  root.style.colorScheme=t||'';
  metas(eff());
  var bs=document.querySelectorAll('.th-btn'); for(var i=0;i<bs.length;i++) label(bs[i]);
}
apply(saved());
document.addEventListener('DOMContentLoaded',function(){metas(eff())});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(!saved())apply('')})}catch(e){}
addEventListener('storage',function(e){if(e.key===K)apply(saved())});

function reduce(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}}
function set(t,x,y){
  var run=function(){try{localStorage.setItem(K,JSON.stringify(t))}catch(e){} apply(t)};
  if(!document.startViewTransition||reduce()){
    if(!reduce()){root.classList.add('theme-fade');setTimeout(function(){root.classList.remove('theme-fade')},360)}
    run();return}
  root.classList.add('theme-vt');
  var vt=document.startViewTransition(run);
  vt.ready.then(function(){
    var r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
    root.animate({clipPath:['circle(0px at '+x+'px '+y+'px)','circle('+r+'px at '+x+'px '+y+'px)']},
      {duration:420,easing:'cubic-bezier(.77,0,.175,1)',pseudoElement:'::view-transition-new(root)'});
  }).catch(function(){});
  vt.finished.then(function(){root.classList.remove('theme-vt')},function(){root.classList.remove('theme-vt')});
}
var SUN='<svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg>';
var MOON='<svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.2A8 8 0 0 1 9.8 4a8 8 0 1 0 10.2 10.2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
function label(b){var d=eff()==='dark'; b.dataset.mode=eff(); b.setAttribute('aria-label',d?'라이트 모드로 바꾸기':'다크 모드로 바꾸기'); b.title=d?'라이트 모드':'다크 모드'}
var css=false;
function injectCSS(){if(css)return;css=true;var s=document.createElement('style');s.textContent=
'.th-btn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;flex:none;border-radius:50%;border:1px solid currentColor;background:none;color:inherit;cursor:pointer;padding:0;opacity:.92;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform 140ms cubic-bezier(.23,1,.32,1)}'+
'.th-btn:active{transform:scale(.94)}'+
'.th-btn svg{grid-area:1/1;transition:transform 260ms cubic-bezier(.23,1,.32,1),opacity 200ms ease,filter 200ms ease}'+
'.th-btn[data-mode=light] .i-moon,.th-btn[data-mode=dark] .i-sun{opacity:0;transform:rotate(-90deg) scale(.6);filter:blur(2px)}'+
'@media (prefers-reduced-motion:reduce){.th-btn svg{transition:opacity 150ms ease}.th-btn[data-mode] svg{transform:none!important;filter:none!important}}';
document.head.appendChild(s)}
function mount(el,opt){
  if(!el) return null; injectCSS();
  var b=document.createElement('button'); b.type='button'; b.className='th-btn'+(opt&&opt.cls?' '+opt.cls:''); b.innerHTML=SUN+MOON; label(b);
  b.addEventListener('click',function(e){
    var r=b.getBoundingClientRect(), x=e.clientX||r.left+r.width/2, y=e.clientY||r.top+r.height/2;
    set(eff()==='dark'?'light':'dark',x,y)});
  el.appendChild(b); return b;
}
/* 창 닫기: 바로 숨기지 않고 짧게 사라진 뒤 숨김 */
function close(el,done){
  if(!el){done&&done();return}
  if(el.classList.contains('is-closing')) return;
  el.classList.add('is-closing');
  setTimeout(function(){el.classList.remove('is-closing');done&&done()},270);
}
window.UIX={close:close};
/* 화면 이동 방향: 첫 화면으로 돌아갈 땐 'back'(왼쪽에서), 나머지는 'forward'(오른쪽에서) */
function isHome(u){try{var p=new URL(u,location.href).pathname;return /\/$|\/index\.html$/.test(p)}catch(e){return false}}
addEventListener('pagereveal',function(e){
  if(!e.viewTransition) return;
  try{var from=(window.navigation&&navigation.activation&&navigation.activation.from&&navigation.activation.from.url)||document.referrer||'';
    e.viewTransition.types.add(isHome(location.href)&&from&&!isHome(from)?'back':'forward')}catch(err){}
});
window.Theme={mount:mount,get:eff,set:function(t){set(t,innerWidth-40,40)}};
})();
</script>

<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#15181f; --sub:#5d6575; --line:#e3e6ec; --soft:#eef0f4;
  --l1:#0052a4; --l2:#00a84d; --l3:#ef7c1c; --l4:#00a5de; --l5:#996cac; --l9:#a8924a;
  --f:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101218;--card:#191c24;--ink:#eceef3;--sub:#9aa1b0;--line:#2a2e39;--soft:#20232c;--l1:#4f8fe0;--l9:#cdbb7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101218;--card:#191c24;--ink:#eceef3;--sub:#9aa1b0;--line:#2a2e39;--soft:#20232c;--l1:#4f8fe0;--l9:#cdbb7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html,body{overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-text-size-adjust:100%;word-break:keep-all;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--l1);outline-offset:2px}

/* 한 화면: 머리말 · 진도 · 타일 · 꼬리말이 화면 높이를 나눠 쓴다 (스크롤 없음) */
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px));
  max-width:1360px;margin:0 auto}
.hd{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.5px;flex:none}
.hd h1{margin:0;font-size:19px;line-height:1.15;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:460px){.hd .cs-pill{width:38px;padding:0;justify-content:center;font-size:0;gap:0;min-height:38px}.hd .cs-pill i{width:10px;height:10px}}
.hd p{margin:2px 0 0;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd>div:nth-child(2){min-width:0}
.hd .sp{margin-left:auto;color:var(--sub);flex:none}

.prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.st b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.5px;white-space:nowrap}
.st b small{font-size:13px;color:var(--sub);font-weight:500;margin-left:2px}
.st span{display:block;font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .meter{height:4px;border-radius:2px;background:var(--soft);margin-top:7px;overflow:hidden}
.st .meter i{display:block;height:100%;background:var(--c)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:10px;min-height:0}
.tile{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 16px;min-height:0;overflow:hidden;}
@media (hover:hover) and (pointer:fine){.tile:hover{border-color:var(--c);transform:translateY(-2px)}}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--c)}
.tile .no{width:34px;height:34px;border-radius:50%;border:3px solid var(--c);display:grid;place-items:center;font:600 14px var(--mono);color:var(--c);background:var(--card);flex:none}
.tile h2{margin:auto 0 0;font-size:18px;line-height:1.25;letter-spacing:-.3px}
.tile p{margin:4px 0 0;font-size:12.5px;line-height:1.45;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tag{position:absolute;top:14px;right:14px;font-size:11.5px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--card)}
.tile .tag.now{color:#fff;background:var(--c);border-color:var(--c)}
.ft{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--sub)}
.ft span:last-child{text-align:right}

/* 넓은 화면(16:9 PC): 왼쪽에 진도, 오른쪽에 3×2 타일 */
@media (min-width:900px){
  body{display:grid;place-items:center}
  .app{width:100%;max-width:1280px;max-height:880px;grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:18px;row-gap:18px;padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:16px}
  .hd{grid-column:1/-1}
  .mark{width:48px;height:48px;font-size:16px}.hd h1{font-size:24px}.hd p{font-size:13.5px}
  .prog{grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr);gap:14px;min-height:0}
  .st{padding:18px 20px;display:flex;flex-direction:column;justify-content:center;border-radius:18px}
  .st b{font-size:36px}.st b small{font-size:15px}.st span{font-size:13.5px;margin-top:6px}.st .meter{height:5px;margin-top:12px}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  .tile{padding:24px 24px 26px;border-radius:22px}
  .tile .no{width:46px;height:46px;font-size:17px;border-width:4px}
  .tile h2{font-size:25px}.tile p{font-size:14.5px;-webkit-line-clamp:3;margin:8px 0 0}
  .tile .tag{top:24px;right:24px;font-size:12.5px;padding:2px 10px}
  .ft{grid-column:1/-1;font-size:12.5px}
}
/* 낮은 화면에서도 스크롤 없이: 설명을 줄인다 */
@media (max-height:700px) and (max-width:899px){.tile p{display:none}.st span{display:none}.st b{font-size:19px}.app{gap:9px}.tile{padding:11px 11px 13px}.tile .no{width:30px;height:30px}.tile .tag{top:11px;right:11px}}
@media (max-height:640px) and (min-width:900px){.tile p{display:none}.st span{font-size:12px}}
@media (max-width:899px) and (orientation:landscape) and (max-height:500px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.prog{display:none}.app{grid-template-rows:auto 0 minmax(0,1fr) auto}}

/* PDF 목록 창 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.45);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:var(--card);width:min(560px,100%);max-height:86dvh;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:900px){.ov{align-items:center}.sheet{border-radius:20px;padding:22px}}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet h3{margin:0;font-size:18px}
.sheet .x{width:40px;height:40px;border:0;background:var(--soft);border-radius:50%;font-size:20px;cursor:pointer}
.sheet ul{list-style:none;margin:0;padding:0}
.sheet li a,.sheet li div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:11px 4px;border-top:1px solid var(--line);min-height:52px}
.sheet li b{font-size:15px}
.sheet li small{grid-column:1;font-size:12.5px;color:var(--sub)}
.sheet li em{grid-row:1/span 2;grid-column:2;font-style:normal;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.sheet li div{opacity:.55}
@media (prefers-reduced-motion:reduce){.tile:hover{transform:none}}
</style>
<style id="polish">
/* 공통 다듬기 (Emil Kowalski 디자인 엔지니어링 원칙)
   - 강한 ease-out 곡선, UI 애니메이션 300ms 이하, transform·opacity만 움직임
   - 누르면 바로 반응(:active scale), 마우스가 있는 기기에서만 hover
   - 휴대폰: 탭 번쩍임 없애기, 탭 지연 없애기, 버튼 글자 길게 눌러 선택되지 않게, 입력칸 16px(확대 방지) */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
a,button,summary,label,select,[role=button],[data-go],[data-fn]{touch-action:manipulation}
button,summary,[role=button],.tile,.set,.opt,.op,.cell,.card,.tab,.tbtn,.btn,.cs-pill,.tychips button,.chips button,.qf button,.orow .n,.keys button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (pointer:coarse){input:not([type=checkbox]):not([type=radio]),textarea,select{font-size:max(16px,1em)}}

/* 누름 피드백: 손가락이 닿는 순간 반응 (작은 버튼 .97, 큰 카드 .98) */
.btn,.tbtn,.cs-pill,.cs-dlg button,.op,.qf button,.nv button,.lockb,.chips button,.tychips button,.wall button,.tab,.res button,.homeback,.home-a,.keys button,.calc .x,.pop .x,.sheet .x,.qjump,.wrow .ac a,.orow .n,.cell,
.set,.opt,.card,.tile,.sheet li a,.pn a{transition:transform 140ms var(--ease-out),background-color 150ms ease,border-color 150ms ease,color 150ms ease,box-shadow 150ms ease}
.btn:active:not(:disabled),.tbtn:active:not(:disabled),.cs-pill:active,.cs-dlg button:active,.op:active:not(:disabled),.qf button:active,.nv button:active:not(:disabled),.lockb:active,.chips button:active,.tychips button:active,.wall button:active,.tab:active,.res button:active,.homeback:active,.home-a:active,.keys button:active,.calc .x:active,.pop .x:active,.sheet .x:active,.qjump:active,.wrow .ac a:active,.orow .n:active,.cell:active{transform:scale(.97)}
.set:active,.opt:active:not(:disabled),.card:active,.tile:active,.sheet li a:active,.pn a:active{transform:scale(.98)}

/* 열리는 창: 아래에서 올라오는 시트는 드로어 곡선, 가운데 창은 .96에서 커지며 나타남 (닫힐 땐 바로) */
@media (prefers-reduced-motion:no-preference){
  .cs-ov,.modal,.ov:not([hidden]),.sheetwrap:not([hidden]){transition:opacity 200ms ease}
  .cs-dlg,.dlg,.sheetwrap .sheet{transition:transform 220ms var(--ease-out),opacity 220ms var(--ease-out)}
  .ov .sheet{transition:transform 320ms var(--ease-drawer)}
  .calc{transform-origin:right bottom;transition:transform 180ms var(--ease-out),opacity 180ms var(--ease-out)}
  .toast{transition:transform 260ms var(--ease-out),opacity 260ms var(--ease-out)}
  .pop:not([hidden]){transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out)}
  .qz .ex{transition:transform 200ms var(--ease-out),opacity 200ms var(--ease-out)}
  @starting-style{.cs-ov,.modal,.ov:not([hidden]),.sheetwrap:not([hidden]){opacity:0}.cs-dlg,.dlg,.sheetwrap .sheet{opacity:0;transform:scale(.96)}.ov .sheet{transform:translateY(100%)}.calc{opacity:0;transform:scale(.95)}.toast{opacity:0;transform:translate(-50%,-8px)}.pop:not([hidden]){opacity:0;transform:scale(.97)}.qz .ex{opacity:0;transform:translateY(4px)}}
}
@media (prefers-reduced-motion:no-preference) and (min-width:900px){
  .ov .sheet{transition:transform 220ms var(--ease-out),opacity 220ms var(--ease-out)}
  @starting-style{.ov .sheet{opacity:0;transform:scale(.96)}}
}
@media (prefers-reduced-motion:no-preference) and (max-width:700px){
  .pop:not([hidden]){transition:transform 280ms var(--ease-drawer)}
  @starting-style{.pop:not([hidden]){transform:translateY(100%);opacity:1}}
}
@media (prefers-reduced-motion:no-preference) and (max-width:720px){
  .sheetwrap .sheet{transition:transform 320ms var(--ease-drawer)}
  @starting-style{.sheetwrap .sheet{transform:translateY(100%);opacity:1}}
}

.toast.out{opacity:0;transition:opacity 150ms ease!important}
/* 움직임 줄이기 설정: 위치·크기 변화는 빼고 색과 투명도만 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important}
  .btn:active,.tbtn:active,.op:active,.set:active,.opt:active,.card:active,.tile:active,.cell:active,.sheet li a:active{transform:none!important}
}
/* 안에서 스크롤되는 창은 끝에 닿아도 뒤 페이지가 따라 움직이지 않게 */
.sheet,.cs-dlg,.omr .list,.res,.pop{overscroll-behavior:contain}

/* 화면 사이 이동: 같은 사이트 안에서 페이지가 바뀔 때 220ms로 부드럽게 겹쳐 바뀜 (지원 브라우저만) */
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:220ms;animation-timing-function:cubic-bezier(.23,1,.32,1)}
/* 다크 모드 전환: 누른 단추에서 원이 퍼짐 (theme.js) */
html.theme-vt::view-transition-old(root),html.theme-vt::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.theme-vt::view-transition-old(root){z-index:1}
html.theme-vt::view-transition-new(root){z-index:2}
@media (prefers-reduced-motion:reduce){@view-transition{navigation:none}}

/* 첫 화면: 그날 처음 열 때만 카드가 차례로 떠오르고 진도 막대가 채워짐 (30~40ms 간격, 누르는 데 방해 없음) */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fillx{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:no-preference){
  .intro .st,.intro .tile{animation:rise 340ms cubic-bezier(.23,1,.32,1) backwards}
  .intro .st:nth-child(2){animation-delay:40ms}.intro .st:nth-child(3){animation-delay:80ms}
  .intro .tile:nth-child(1){animation-delay:60ms}.intro .tile:nth-child(2){animation-delay:95ms}.intro .tile:nth-child(3){animation-delay:130ms}
  .intro .tile:nth-child(4){animation-delay:165ms}.intro .tile:nth-child(5){animation-delay:200ms}.intro .tile:nth-child(6){animation-delay:235ms}
  .intro .meter i{transform-origin:left center;animation:fillx 700ms cubic-bezier(.23,1,.32,1) 250ms backwards}
}

/* ===== 더 부드럽게 ===== */
/* 닫힐 때도 스르륵 (열 때보다 빠르게 150~200ms) */
.is-closing{opacity:0!important;pointer-events:none;transition:opacity 160ms ease!important}
.is-closing .sheet,.is-closing .cs-dlg,.is-closing .dlg{transform:scale(.97);transition:transform 180ms var(--ease-out),opacity 160ms ease!important}
.ov.is-closing .sheet{transform:translateY(100%);transition:transform 200ms var(--ease-out)!important}
.pop.is-closing,.calc.is-closing{transform:scale(.96);transition:transform 160ms var(--ease-out),opacity 160ms ease!important}
@media (min-width:900px){.ov.is-closing .sheet{transform:scale(.97)}}
@media (max-width:720px){.sheetwrap.is-closing .sheet{transform:translateY(100%);transition:transform 200ms var(--ease-out)!important}}
@media (max-width:700px){.pop.is-closing{opacity:1!important;transform:translateY(100%);transition:transform 200ms var(--ease-out)!important}}

@media (prefers-reduced-motion:no-preference){
  /* 문제를 넘기면 누른 방향에서 살짝 밀려 들어옴 (위키 문제 창 · CBT) */
  .qcard.in-r,.qcard.in-l{transition:transform 240ms var(--ease-out),opacity 200ms ease}
  /* 결과 화면: 판정 → 점수 → 문항 순서로 차례대로 */
  #result .panel,#result .acts2{animation:rise 360ms var(--ease-out) backwards}
  #result .panel:nth-of-type(2){animation-delay:60ms}#result .panel:nth-of-type(3){animation-delay:120ms}#result .panel:nth-of-type(4){animation-delay:170ms}#result .acts2{animation-delay:200ms}
  #result .big{animation:pop 420ms var(--ease-out) 80ms backwards}
  #result .grid40 .cell{animation:rise 260ms var(--ease-out) backwards}
  /* 약점 막대·진도 막대가 채워짐 */
  .wbar i{transform-origin:left center;animation:fillx 700ms var(--ease-out) 120ms backwards}
  /* 접었다 펴는 상자(details)가 높이를 따라 부드럽게 열림 */
  :root{interpolate-size:allow-keywords}
  details::details-content{height:0;overflow:clip;transition:height 260ms var(--ease-out),content-visibility 260ms allow-discrete}
  details[open]::details-content{height:auto}
}
@starting-style{
  .qcard.in-r{opacity:0;transform:translateX(16px)}
  .qcard.in-l{opacity:0;transform:translateX(-16px)}
  /* 답을 고르면 정답·오답 색이 바로 칠해지지 않고 스르륵 번짐 */
  .qz .op.ok,.qz .op.no,.opt.right,.opt.wrong{background-color:var(--paper);border-color:var(--line)}
}
.qz .op,.opt{transition:transform 140ms var(--ease-out),background-color 260ms ease,border-color 260ms ease,color 260ms ease}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
/* 목차·선택 표시도 색이 부드럽게 옮겨감 */
.side li a,.toc a,nav.lines button,.seg button,.qf button,.tab{transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease,transform 140ms var(--ease-out)}
/* 다크 모드 전환을 지원하지 않는 브라우저: 원 대신 색이 0.3초 동안 바뀜 */
.theme-fade,.theme-fade *,.theme-fade *::before,.theme-fade *::after{transition:background-color 300ms ease,color 300ms ease,border-color 300ms ease,fill 300ms ease,stroke 300ms ease!important}
@media (prefers-reduced-motion:reduce){.is-closing *{transform:none!important}}

/* ===== 모션 강하게: 같은 자리의 움직임을 더 크고 분명하게, 화면 이동은 옆으로 미는 슬라이드 ===== */
.btn:active:not(:disabled),.tbtn:active:not(:disabled),.cs-pill:active,.cs-dlg button:active,.op:active:not(:disabled),.qf button:active,.nv button:active:not(:disabled),.lockb:active,.chips button:active,.tychips button:active,.wall button:active,.tab:active,.res button:active,.homeback:active,.home-a:active,.keys button:active,.calc .x:active,.pop .x:active,.sheet .x:active,.qjump:active,.wrow .ac a:active,.orow .n:active,.cell:active,.th-btn:active{transform:scale(.93)}
.set:active,.opt:active:not(:disabled),.card:active,.tile:active,.sheet li a:active,.pn a:active{transform:scale(.96)}
@keyframes rise2{from{opacity:0;transform:translateY(30px) scale(.96)}}
@keyframes choose{0%{transform:scale(.96)}45%{transform:scale(1.035)}100%{transform:none}}
@keyframes bigpop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.06)}100%{transform:none}}
@keyframes vt-in-r{from{transform:translateX(100%)}}
@keyframes vt-out-l{to{transform:translateX(-28%);opacity:.35}}
@keyframes vt-out-r{to{transform:translateX(100%)}}
@keyframes vt-in-l{from{transform:translateX(-28%);opacity:.35}}
@media (prefers-reduced-motion:no-preference){
  .cs-ov,.modal,.ov:not([hidden]),.sheetwrap:not([hidden]){transition:opacity 280ms ease}
  .cs-dlg,.dlg,.sheetwrap .sheet{transition:transform 420ms var(--ease-out),opacity 300ms var(--ease-out)}
  .ov .sheet{transition:transform 480ms var(--ease-drawer)}
  .calc{transition:transform 340ms var(--ease-out),opacity 260ms ease}
  .toast{transition:transform 460ms var(--ease-out),opacity 300ms ease}
  .pop:not([hidden]){transition:transform 320ms var(--ease-out),opacity 240ms ease}
  .qz .ex{transition:transform 420ms var(--ease-out),opacity 320ms ease}
  .qcard.in-r,.qcard.in-l{transition:transform 420ms var(--ease-out),opacity 300ms ease}
  .qz .op,.opt{transition:transform 160ms var(--ease-out),background-color 450ms ease,border-color 450ms ease,color 450ms ease}
  .qz .op.ok,.qz .op.no{animation:choose 420ms var(--ease-out)}
  .tile:hover{box-shadow:0 14px 30px -12px rgba(0,0,0,.28)}
  @media (hover:hover) and (pointer:fine){.tile:hover{transform:translateY(-6px)}}
  .intro .st,.intro .tile{animation:rise2 600ms var(--ease-out) backwards}
  .intro .st:nth-child(2){animation-delay:70ms}.intro .st:nth-child(3){animation-delay:140ms}
  .intro .tile:nth-child(1){animation-delay:120ms}.intro .tile:nth-child(2){animation-delay:190ms}.intro .tile:nth-child(3){animation-delay:260ms}
  .intro .tile:nth-child(4){animation-delay:330ms}.intro .tile:nth-child(5){animation-delay:400ms}.intro .tile:nth-child(6){animation-delay:470ms}
  .intro .meter i{animation:fillx 1100ms var(--ease-out) 400ms backwards}
  #result .panel,#result .acts2{animation:rise2 560ms var(--ease-out) backwards}
  #result .panel:nth-of-type(2){animation-delay:120ms}#result .panel:nth-of-type(3){animation-delay:220ms}#result .panel:nth-of-type(4){animation-delay:300ms}#result .acts2{animation-delay:360ms}
  #result .big{animation:bigpop 640ms var(--ease-out) 120ms backwards}
  .wbar i{animation:fillx 1000ms var(--ease-out) 200ms backwards}
  details::details-content{transition:height 420ms var(--ease-out),content-visibility 420ms allow-discrete}
  @starting-style{
    .cs-ov,.modal,.ov:not([hidden]),.sheetwrap:not([hidden]){opacity:0}
    .cs-dlg,.dlg,.sheetwrap .sheet{opacity:0;transform:translateY(28px) scale(.9)}
    .ov .sheet{transform:translateY(100%)}
    .calc{opacity:0;transform:translateY(16px) scale(.85)}
    .toast{opacity:0;transform:translate(-50%,-32px) scale(.92)}
    .pop:not([hidden]){opacity:0;transform:translateY(-6px) scale(.88)}
    .qz .ex{opacity:0;transform:translateY(18px)}
    .qcard.in-r{opacity:0;transform:translateX(64px)}
    .qcard.in-l{opacity:0;transform:translateX(-64px)}
  }
  /* 화면 이동: 새 화면이 오른쪽에서 밀려 들어오고, 첫 화면으로 돌아갈 땐 반대로 */
  ::view-transition-old(root){animation:440ms var(--ease-in-out) both vt-out-l}
  ::view-transition-new(root){animation:440ms var(--ease-in-out) both vt-in-r}
  html:active-view-transition-type(back)::view-transition-old(root){animation-name:vt-out-r;z-index:2}
  html:active-view-transition-type(back)::view-transition-new(root){animation-name:vt-in-l;z-index:1}
}
@media (prefers-reduced-motion:no-preference) and (min-width:900px){
  .ov .sheet{transition:transform 420ms var(--ease-out),opacity 300ms ease}
  @starting-style{.ov .sheet{opacity:0;transform:translateY(28px) scale(.9)}}
}
@media (prefers-reduced-motion:no-preference) and (max-width:700px){
  .pop:not([hidden]){transition:transform 440ms var(--ease-drawer)}
  @starting-style{.pop:not([hidden]){transform:translateY(100%);opacity:1}}
}
@media (prefers-reduced-motion:no-preference) and (max-width:720px){
  .sheetwrap .sheet{transition:transform 480ms var(--ease-drawer)}
  @starting-style{.sheetwrap .sheet{transform:translateY(100%);opacity:1}}
}
/* 닫힘도 더 분명하게 (열 때보다는 짧게) */
.is-closing{transition:opacity 240ms ease!important}
.is-closing .sheet,.is-closing .cs-dlg,.is-closing .dlg{transform:translateY(20px) scale(.92);transition:transform 260ms var(--ease-out),opacity 240ms ease!important}
.ov.is-closing .sheet{transform:translateY(100%);transition:transform 280ms var(--ease-out)!important}
.pop.is-closing,.calc.is-closing{transform:scale(.9);transition:transform 240ms var(--ease-out),opacity 220ms ease!important}
@media (min-width:900px){.ov.is-closing .sheet{transform:translateY(20px) scale(.92)}}
@media (max-width:720px){.sheetwrap.is-closing .sheet{transform:translateY(100%);transition:transform 280ms var(--ease-out)!important}}
@media (max-width:700px){.pop.is-closing{transform:translateY(100%);transition:transform 280ms var(--ease-out)!important}}
</style>

<body>
<div class="app">
  <header class="hd">
    <div class="mark" aria-hidden="true">컴활</div>
    <div><h1>컴퓨터활용능력 2급</h1><p id="sub">필기 공부</p></div>
    <div class="sp" id="sp" style="display:flex;gap:8px;align-items:center"></div>
  </header>
  <section class="prog" aria-label="공부 현황" id="prog"></section>
  <nav class="tiles" aria-label="공부 메뉴" id="tiles"></nav>
  <footer class="ft"><span id="today"></span><span id="foot"></span></footer>
</div>
<div class="ov" id="ov" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pdfT">
  <div class="sh"><h3 id="pdfT">PDF 노트</h3><button class="x" type="button" id="ovx" aria-label="닫기">×</button></div>
  <ul id="pdfs"></ul>
</div></div>
<script>window.CS_MODE=/*MODE*/'online'</script>
<script src="common.js"></script>
<script>
const MODE=window.CS_MODE, CARDS=271, CBT_N=510;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PDFS=[
  ['합격 노트','시험 정보, 강의 노트, 1·2과목 핵심, 계산 연습, OX · 컬러','pdf/합격노트_컬러.pdf'],
  ['합격 노트 흑백','흑백 프린터용','pdf/합격노트_흑백.pdf'],
  ['합격 노트 2쪽 모아','A4 한 장에 두 쪽','pdf/합격노트_2쪽모아.pdf'],
  ['1과목 총정리','강의 1~22강 노트와 확인 문제 139','pdf/1과목_총정리.pdf'],
  ['공부 노트 10/19','9~22강 지하철 노트','pdf/공부노트_2026-10-19.pdf'],
  ['공부 노트 10/18','1~8강 지하철 노트','pdf/공부노트_2026-10-18.pdf'],
  ['1과목 완성 노트','핵심 요약 001~082와 강의 노트, OX','pdf/1과목_완성노트.pdf',1],
  ['2과목 완성 노트','핵심 요약 083~134와 함수 연습','pdf/2과목_완성노트.pdf',1],
  ['핵심 요약 재디자인','핵심 요약 134항목','pdf/핵심요약_재디자인.pdf',1]];
const pdfOpen=p=>!(p[3]&&MODE!=='offline');
function tiles(){
  let last='';try{last=localStorage.getItem('launcher-last')||''}catch(e){}
  const lock=window.CS&&CS.locked(); const weak=window.CS?CS.get('weak',[]):[];
  const T=[
    ['study','1','--l1','학습 카드','강의별 용어 카드를 넘기며 외운다','metro.html#study'],
    ['exam','2','--l2','강의 문제','강의 확인 문제, 오늘 복습, 오답 다시 풀기','metro.html#exam'],
    ['practice','3','--l3','응용 연습','단축키 눌러 보기, 미니 엑셀 수식, 표시 형식','metro.html#practice'],
    ['cbt','4','--l4','CBT 모의시험',weak.length?`약한 유형: ${weak.map(x=>x.t.replace(/\s*\(.*\)/,'').split(':')[0]+' '+x.pct+'%').join(', ')}`:'실제 시험처럼 40문항 40분 · 기출 9회와 유형 연습','cbt.html',lock?'잠김':weak.length?'약점 '+weak.length:''],
    ['wiki','5','--l5','컴활위키','문서 34개 · 문서마다 그 범위의 문제와 해설','wiki.html#main'],
    ['pdf','9','--l9','PDF 노트',`인쇄용 노트 ${PDFS.filter(pdfOpen).length}개`,'#pdf']];
  $('#tiles').innerHTML=T.map(([id,n,c,t,s,h,tag])=>`<a class="tile" href="${h}" data-id="${id}" style="--c:var(${c})"><span class="no" aria-hidden="true">${n}</span>${id===last?'<span class="tag now">최근</span>':tag?`<span class="tag">${tag}</span>`:''}<h2>${t}</h2><p>${esc(s)}</p></a>`).join('');
}
function prog(){
  let known=0;try{known=JSON.parse(localStorage.getItem('cm_known')||'[]').length}catch(e){}
  const st=window.CS?CS.stats():{n:0,ok:0}, hist=window.CS?CS.hist():[];
  const best=hist.reduce((m,h)=>Math.max(m,h.avg||0),0), lastH=hist[hist.length-1];
  const pct=st.n?Math.round(st.ok/st.n*100):0;
  const cell=(v,unit,lab,w,c)=>`<div class="st"><b>${v}<small>${unit}</small></b><span>${lab}</span><div class="meter"><i style="width:${Math.max(0,Math.min(100,w))}%;--c:var(${c})"></i></div></div>`;
  $('#prog').innerHTML=
    cell(known,'/'+CARDS,'외운 학습 카드',CARDS?known/CARDS*100:0,'--l1')+
    cell(st.n?pct:'–',st.n?'%':'',st.n?`푼 문제 ${st.n}개 중 ${st.ok}개 정답`:'문제 정답률',pct,'--l2')+
    cell(best||'–',best?'점':'',lastH?`CBT 최고 · 최근 ${lastH.avg}점 ${lastH.pass?'합격':'불합격'}`:'CBT 최고 점수',best,'--l4');
}
function openPdf(){
  $('#pdfs').innerHTML=PDFS.map(p=>pdfOpen(p)?`<li><a href="${esc(p[2])}"><b>${esc(p[0])}</b><small>${esc(p[1])}</small><em>PDF</em></a></li>`:`<li><div><b>${esc(p[0])}</b><small>USB 오프라인 묶음에만 있음</small><em>개인용</em></div></li>`).join('');
  $('#ov').hidden=false; $('#ovx').focus();
}
const closePdf=()=>{if($('#ov').hidden)return;window.UIX?UIX.close($('#ov'),()=>{$('#ov').hidden=true}):($('#ov').hidden=true)};
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]'); if(!a) return;
  try{localStorage.setItem('launcher-last',a.dataset.id)}catch(err){}
  if(a.getAttribute('href')==='#pdf'){e.preventDefault();openPdf()}
});
$('#ovx').onclick=closePdf; $('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closePdf()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)closePdf()});
const d=new Date(); $('#today').textContent=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
$('#sub').textContent=`필기 · 강의 22강 · 기출 ${CBT_N}문항`;
$('#foot').textContent=MODE==='offline'?'오프라인 묶음 · 기록은 이 컴퓨터에 저장':'각 화면 왼쪽 위 ‹ 로 돌아온다';
window.Theme&&Theme.mount($('#sp'));
document.querySelector('.app').classList.add('intro');
if(window.CS){CS.mountPill($('#sp'));CS.on(w=>{if(w==='data'||w==='unlock'||w==='lock'){prog();tiles()}})}
tiles(); prog();
addEventListener('pageshow',()=>{prog();tiles()});
function fwd(){if(/^#(study|practice|exam)/.test(location.hash)) location.replace('metro.html'+location.hash)}
fwd(); addEventListener('hashchange',fwd);
</script>
</body></html>
