<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13254a" media="(prefers-color-scheme: dark)">
<script>/* 다크 모드 전환 (모든 화면 공통)
   - 처음에는 기기 설정(라이트/다크)을 따르고, 단추를 누르면 그 선택을 기억한다 (localStorage cs_theme)
   - <head>에서 바로 실행해 첫 화면부터 깜빡임 없이 적용
   - 전환할 때 누른 단추에서 원이 퍼지며 바뀐다 (View Transitions, 지원 안 하는 브라우저는 즉시) */
(function(){
'use strict';
var K='cs_theme', root=document.documentElement;
function saved(){try{var v=JSON.parse(localStorage.getItem(K)||'""');return v==='light'||v==='dark'?v:''}catch(e){return ''}}
function sys(){try{return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){return 'light'}}
function eff(){return saved()||sys()}
/* 상태 표시줄 색: 고른 테마의 색을 두 meta 모두에 넣는다 */
function metas(t){
  var ms=document.querySelectorAll('meta[name="theme-color"]');
  for(var i=0;i<ms.length;i++){var m=ms[i];
    if(!m.dataset.orig){m.dataset.orig=m.content;m.dataset.media=m.getAttribute('media')||''}
    var dark=/dark/.test(m.dataset.media), light=/light/.test(m.dataset.media);
    if(!dark&&!light) continue;
    var pick=null; for(var j=0;j<ms.length;j++){var n=ms[j]; if(new RegExp(t).test(n.dataset.media||n.getAttribute('media')||'')) pick=n.dataset.orig||n.content}
    m.content=saved()&&pick?pick:m.dataset.orig;
  }
}
function apply(t){
  if(t) root.setAttribute('data-theme',t); else root.removeAttribute('data-theme');
  root.style.colorScheme=t||'';
  metas(eff());
  var bs=document.querySelectorAll('.th-btn'); for(var i=0;i<bs.length;i++) label(bs[i]);
}
apply(saved());
document.addEventListener('DOMContentLoaded',function(){metas(eff())});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(!saved())apply('')})}catch(e){}
addEventListener('storage',function(e){if(e.key===K)apply(saved())});

function reduce(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}}
function set(t,x,y){
  var run=function(){try{localStorage.setItem(K,JSON.stringify(t))}catch(e){} apply(t)};
  if(!document.startViewTransition||reduce()){
    if(!reduce()){root.classList.add('theme-fade');setTimeout(function(){root.classList.remove('theme-fade')},360)}
    run();return}
  root.classList.add('theme-vt');
  var vt=document.startViewTransition(run);
  vt.ready.then(function(){
    var r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
    root.animate({clipPath:['circle(0px at '+x+'px '+y+'px)','circle('+r+'px at '+x+'px '+y+'px)']},
      {duration:420,easing:'cubic-bezier(.77,0,.175,1)',pseudoElement:'::view-transition-new(root)'});
  }).catch(function(){});
  vt.finished.then(function(){root.classList.remove('theme-vt')},function(){root.classList.remove('theme-vt')});
}
var SUN='<svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg>';
var MOON='<svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.2A8 8 0 0 1 9.8 4a8 8 0 1 0 10.2 10.2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
function label(b){var d=eff()==='dark'; b.dataset.mode=eff(); b.setAttribute('aria-label',d?'라이트 모드로 바꾸기':'다크 모드로 바꾸기'); b.title=d?'라이트 모드':'다크 모드'}
var css=false;
function injectCSS(){if(css)return;css=true;var s=document.createElement('style');s.textContent=
'.th-btn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;flex:none;border-radius:50%;border:1px solid currentColor;background:none;color:inherit;cursor:pointer;padding:0;opacity:.92;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform 140ms cubic-bezier(.23,1,.32,1)}'+
'.th-btn:active{transform:scale(.94)}'+
'.th-btn svg{grid-area:1/1;transition:transform 260ms cubic-bezier(.23,1,.32,1),opacity 200ms ease,filter 200ms ease}'+
'.th-btn[data-mode=light] .i-moon,.th-btn[data-mode=dark] .i-sun{opacity:0;transform:rotate(-90deg) scale(.6);filter:blur(2px)}'+
'@media (prefers-reduced-motion:reduce){.th-btn svg{transition:opacity 150ms ease}.th-btn[data-mode] svg{transform:none!important;filter:none!important}}';
document.head.appendChild(s)}
function mount(el,opt){
  if(!el) return null; injectCSS();
  var b=document.createElement('button'); b.type='button'; b.className='th-btn'+(opt&&opt.cls?' '+opt.cls:''); b.innerHTML=SUN+MOON; label(b);
  b.addEventListener('click',function(e){
    var r=b.getBoundingClientRect(), x=e.clientX||r.left+r.width/2, y=e.clientY||r.top+r.height/2;
    set(eff()==='dark'?'light':'dark',x,y)});
  el.appendChild(b); return b;
}
/* 창 닫기: 바로 숨기지 않고 짧게 사라진 뒤 숨김 */
function close(el,done){
  if(!el){done&&done();return}
  if(el.classList.contains('is-closing')) return;
  el.classList.add('is-closing');
  setTimeout(function(){el.classList.remove('is-closing');done&&done()},270);
}
window.UIX={close:close};
/* 화면 이동 방향: 첫 화면으로 돌아갈 땐 'back'(왼쪽에서), 나머지는 'forward'(오른쪽에서) */
function isHome(u){try{var p=new URL(u,location.href).pathname;return /\/$|\/index\.html$/.test(p)}catch(e){return false}}
addEventListener('pagereveal',function(e){
  if(!e.viewTransition) return;
  try{var from=(window.navigation&&navigation.activation&&navigation.activation.from&&navigation.activation.from.url)||document.referrer||'';
    e.viewTransition.types.add(isHome(location.href)&&from&&!isHome(from)?'back':'forward')}catch(err){}
});
window.Theme={mount:mount,get:eff,set:function(t){set(t,innerWidth-40,40)}};
})();
</script>
<title>컴활 2급 필기 CBT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* 레이아웃: 시험 화면(상단 정보줄 + 문제 영역 + 오른쪽 답안 표기란 + 하단 버튼줄). 모바일은 답안 표기란이 아래에서 올라오는 창 */
:root{
  --bg:#e9edf3; --paper:#ffffff; --ink:#1b2333; --sub:#5d6678; --line:#cfd6e2; --soft:#f3f5f9;
  --head:#1f3c74; --head2:#2c4f92; --head-ink:#ffffff; --acc:#1f5fd1; --acc-ink:#ffffff; --sel:#dde8ff;
  --ok:#137a4b; --ok-bg:#e5f5ec; --bad:#c33a2c; --bad-bg:#fdecea; --warn:#b26a00; --warn-bg:#fff3d9;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --fs:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131b; --paper:#171c27; --ink:#e6e9f1; --sub:#9aa3b6; --line:#2d3546; --soft:#1e2431;
  --head:#13254a; --head2:#1c3366; --head-ink:#eef2ff; --acc:#6f9bff; --acc-ink:#0c1530; --sel:#1d2d55;
  --ok:#4cc58c; --ok-bg:#143326; --bad:#ff7e6c; --bad-bg:#3a1a17; --warn:#f0b04a; --warn-bg:#3a2b10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131b; --paper:#171c27; --ink:#e6e9f1; --sub:#9aa3b6; --line:#2d3546; --soft:#1e2431;
  --head:#13254a; --head2:#1c3366; --head-ink:#eef2ff; --acc:#6f9bff; --acc-ink:#0c1530; --sel:#1d2d55;
  --ok:#4cc58c; --ok-bg:#143326; --bad:#ff7e6c; --bad-bg:#3a1a17; --warn:#f0b04a; --warn-bg:#3a2b10; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:0 16px;min-height:44px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}

/* ===== 시작 화면 */
#home{min-height:100%;padding-block:0 calc(32px + env(safe-area-inset-bottom,0px))}
.hbar{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 1px 0 rgba(0,0,0,.08)}
@media (max-width:640px){.hbar .in{padding-block:10px}}
.hbar .in{max-width:1180px;margin:0 auto;padding-block:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hbar h1{font-size:20px;margin:0;font-weight:900;letter-spacing:-.3px}
@media (max-width:640px){.hbar .home-a{color:inherit;text-decoration:none;font-size:28px;line-height:1;padding:0 4px 0 0}
#csp{margin-left:auto}
.hbar .tag{display:none}.hbar .cs-pill{width:38px;padding:0;justify-content:center;font-size:0;gap:0;min-height:38px}.hbar .cs-pill i{width:10px;height:10px}.hbar .in{flex-wrap:nowrap}.hbar h1{font-size:18px;min-width:0}}
.hbar .tag{font-size:12.5px;opacity:.85;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:2px 10px}
.home{max-width:1180px;margin:0 auto;padding-block:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:980px){.home{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px clamp(14px,2.4vw,24px);min-width:0}
.panel h2{font-size:17px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 small{color:var(--sub);font-weight:400;font-size:13px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.set{text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:76px;display:flex;flex-direction:column;gap:3px}
@media (hover:hover) and (pointer:fine){.set:hover{border-color:var(--acc)}}
.set[aria-pressed="true"]{border-color:var(--acc);background:var(--sel);box-shadow:inset 0 0 0 1px var(--acc)}
.set b{font-size:15px}
.set span{font-size:12.5px;color:var(--sub)}
.set .best{font-family:var(--f-mono);font-size:12px;color:var(--ok)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:13.5px;color:var(--sub)}
.form input,.form select{border:1px solid var(--line);background:var(--paper);border-radius:8px;min-height:44px;padding:0 12px;font:inherit;font-size:16px;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex!important;grid-template-columns:none;align-items:center;gap:8px;color:var(--ink)!important;font-size:14px!important;min-height:36px}
.chk input{min-height:auto;width:20px;height:20px}
.rules{font-size:13.5px;color:var(--sub);margin:0;padding-left:18px}
.rules li{margin:3px 0}
.hist{font-size:13.5px;width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hist td,.hist th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.hist th{color:var(--sub);font-weight:500}
.pill{display:inline-block;border-radius:20px;padding:0 8px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.note{font-size:12.5px;color:var(--sub)}

/* ===== 시험 화면 */
#exam{height:100%;display:flex;flex-direction:column}
.ehead{background:var(--head);color:var(--head-ink);flex:none;padding-top:env(safe-area-inset-top,0px)}
.ehead .in{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:8px}
.ehead .title{font-weight:900;font-size:16px;white-space:nowrap}
.ehead .who{display:flex;gap:14px;font-size:13px;opacity:.92;flex-wrap:wrap}
.ehead .who b{font-weight:700}
.timer{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:8px;padding:4px 12px}
.timer span{font-size:12px;opacity:.85}
.timer b{font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:1px;font-variant-numeric:tabular-nums}
.timer.low{background:#c33a2c}
.etool{background:var(--head2);color:var(--head-ink);flex:none}
.etool .in{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding-block:6px;font-size:13px}
.grp{display:flex;align-items:center;gap:4px}
.grp>span{opacity:.85;margin-right:2px}
.tbtn{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--head-ink);border-radius:6px;min-height:34px;min-width:44px;padding:0 8px;cursor:pointer;font-size:13px}
.tbtn[aria-pressed="true"]{background:#fff;color:var(--head);font-weight:700}
.cnt{margin-left:auto;display:flex;gap:12px;font-variant-numeric:tabular-nums}
.cnt b{font-family:var(--f-mono);font-size:15px}
.ebody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px}
.qarea{overflow:auto;padding-block:18px 24px;min-width:0}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:1100px;margin:0 auto}
.qgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px clamp(14px,2vw,22px);font-size:var(--fs);min-width:0}
.weak{grid-column:1/-1}
.weak .sum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--sub);margin:2px 0 10px}
.weak .sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.wrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(90px,1fr) auto;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wrow .nm b{display:block;font-size:15px}.wrow .nm small{color:var(--sub);font-size:12.5px}
.wrow .rt{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.wbar{height:8px;border-radius:4px;background:var(--bad-bg);overflow:hidden;margin-bottom:4px}
.wbar i{display:block;height:100%;background:var(--ok)}
.wrow .ac{display:flex;gap:6px}
.wrow .ac .btn,.wrow .ac a{min-height:36px;padding:0 12px;font-size:13.5px}
.wrow .ac a{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;background:var(--paper)}
.rank{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font-size:12px;font-weight:700;margin-right:6px;vertical-align:1px}
.weak details{margin-top:10px}.weak summary{cursor:pointer;color:var(--acc);font-size:14px;min-height:36px;display:flex;align-items:center}
.wall{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.wall th,.wall td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.wall th{color:var(--sub);font-weight:500}.wall td.r,.wall th.r{text-align:right}
.wall tr.g td{background:var(--soft);font-weight:700;color:var(--sub);font-size:12.5px}
.wall .lv{display:inline-block;min-width:44px;text-align:center;border-radius:20px;padding:0 8px;font-size:12px}
.lv.w3{background:var(--bad-bg);color:var(--bad)}.lv.w2{background:var(--warn-bg);color:var(--warn)}.lv.w1{background:var(--ok-bg);color:var(--ok)}.lv.w0{color:var(--sub)}
.wall button{border:0;background:none;color:var(--acc);font:inherit;font-size:13px;cursor:pointer;padding:4px}
.tychips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tychips button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;min-height:34px}
.tychips button b{color:var(--bad)}
.qsubj .ty{border:1px solid var(--line);border-radius:20px;padding:0 8px}
@media (max-width:640px){.wrow{grid-template-columns:minmax(0,1fr) auto}.wrow .bw{grid-column:1/-1;grid-row:2}.wall .hm{display:none}}
.qsubj{font-size:12.5px;color:var(--sub);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.qstem{font-weight:700;line-height:1.65;white-space:pre-line;margin:0 0 12px}
.qstem .no{color:var(--acc);margin-right:6px}
.qfig{display:block;max-width:100%;height:auto;margin:6px 0 12px;border-radius:4px;background:#fff}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;cursor:pointer;min-height:48px;line-height:1.55}
@media (hover:hover) and (pointer:fine){.opt:hover{border-color:var(--acc)}}
.opt .m{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--sub);display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:-1px}
.opt[aria-checked="true"]{background:var(--sel);border-color:var(--acc)}

.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .m{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.exp{margin-top:12px;border-left:4px solid var(--acc);background:var(--soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;white-space:pre-line}
.exp b{color:var(--acc)}
.verdict{font-weight:900;font-size:13px;border-radius:20px;padding:1px 10px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)} .verdict.bad{background:var(--bad-bg);color:var(--bad)}
.omr{border-left:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;min-height:0}

.omr .list{overflow:auto;padding:6px 8px 12px}
.osub{font-size:12px;color:var(--sub);padding:8px 6px 4px;font-weight:700}
.orow{display:grid;grid-template-columns:38px repeat(4,1fr);align-items:center;gap:2px;padding:2px 4px;border-radius:6px}
.orow.cur{background:var(--sel)}

.ob{width:30px;height:30px;justify-self:center;border-radius:50%;border:1.3px solid var(--line);background:var(--paper);cursor:pointer;font-size:12.5px;color:var(--sub);display:grid;place-items:center;padding:0}
.ob[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.ob.ans{box-shadow:0 0 0 2px var(--ok)}
.efoot{flex:none;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

  $('#qa').innerHTML=`<div class="qgrid${p===2?' two':''}">${ks.map(qhtml).join('')}</div>`;
  $('#qa').scrollTop=0;
  $('#prev').disabled=X.i===0; $('#next').disabled=X.i+p>=X.qs.length;
  document.querySelectorAll('.orow').forEach(r=>r.classList.toggle('cur',ks.includes(+r.dataset.k)));
}
function renderOMR(){
  let h='', last=null;
  X.qs.forEach((q,k)=>{
    if(q.s&&q.s!==last){h+=`<div class="osub">${q.s}과목</div>`;last=q.s}
    h+=`<div class="orow" data-k="${k}"><button class="n${X.ans[k]<0?' empty':''}" type="button" data-jump="${k}" aria-label="${k+1}번 문제로">${k+1}</button>${[0,1,2,3].map(j=>`<button class="ob${X.done&&j===q.a?' ans':''}" type="button" data-q="${k}" data-o="${j}" aria-pressed="${X.ans[k]===j}" aria-label="${k+1}번 ${j+1}" ${X.done?'disabled':''}>${j+1}</button>`).join('')}</div>`;
  });
  $('#ol').innerHTML=h;
  const un=X.ans.filter(a=>a<0).length; if($('#un')) $('#un').textContent=un;
  const p=per(); document.querySelectorAll('.orow').forEach(r=>r.classList.toggle('cur',+r.dataset.k>=X.i&&+r.dataset.k<X.i+p));
}
function go(k,dir){const n=Math.max(0,Math.min(X.qs.length-1,k)); X.inDir=dir&&n!==X.i?(n>X.i?'r':'l'):''; X.i=n; renderQ(); X.inDir=''; renderOMR()}
function onExamClick(e){
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.o!=null&&!X.done){const k=+b.dataset.q,j=+b.dataset.o; X.ans[k]=X.ans[k]===j&&!S.reveal?-1:j; if(S.reveal&&X.ans[k]<0)X.ans[k]=j; const keep=$('#qa').scrollTop; renderQ(); $('#qa').scrollTop=keep; renderOMR(); if(b.closest('.omr')&&innerWidth<=860){} return}
  if(b.dataset.jump!=null){go(+b.dataset.jump,e.detail>0); if(innerWidth<=860) $('#omr').classList.remove('open'); return}
  if(b.dataset.fs!=null){S.fs=+b.dataset.fs;store.set('fs',S.fs);document.documentElement.style.setProperty('--fs',FS[S.fs]+'px');document.querySelectorAll('[data-fs]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.fs===S.fs));return}
  if(b.dataset.lay!=null){S.lay=+b.dataset.lay;store.set('lay',S.lay);document.querySelectorAll('[data-lay]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.lay===S.lay));renderQ();renderOMR();return}
  switch(b.id){
    case 'prev': go(X.i-per(),e.detail>0); break;
    case 'next': go(X.i+per(),e.detail>0); break;
    case 'unb': {const k=X.ans.findIndex((a,i)=>a<0&&i>X.i); const k2=k>=0?k:X.ans.findIndex(a=>a<0); if(k2>=0) go(k2); else toast('안 푼 문제가 없습니다.'); break}
    case 'omrb': $('#omr').classList.add('open'); break;
    case 'omrx': $('#omr').classList.remove('open'); break;
    case 'calcb': calc(); break;
    case 'sub': X.done?showResult():confirmSubmit(); break;
  }
}
document.addEventListener('keydown',e=>{
  if(!X||$('#exam').hidden||e.target.matches('input')) return;
  if(e.key==='ArrowRight'&&!$('#next').disabled) go(X.i+per());
  else if(e.key==='ArrowLeft'&&!$('#prev').disabled) go(X.i-per());
  else if(/^[1-4]$/.test(e.key)&&!X.done&&!$('#layer').firstChild){X.ans[X.i]=+e.key-1;renderQ();renderOMR()}
});
addEventListener('resize',()=>{if(X&&!$('#exam').hidden){renderQ();renderOMR()}});
function modal(title,msg,acts){
  $('#layer').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="dlg"><h4 id="mt">${title}</h4><p>${msg}</p><div class="acts">${acts.map((a,i)=>`<button class="btn ${a.pri?'pri':''}" type="button" data-a="${i}">${a.t}</button>`).join('')}</div></div></div>`;
  const first=$('#layer [data-a]'); first&&first.focus();
  $('#layer').onclick=e=>{const b=e.target.closest('[data-a]'); if(!b) return; const a=acts[+b.dataset.a]; const m=$('#layer .modal'); if(a.f){$('#layer').innerHTML=''; a.f()} else if(window.UIX&&m){UIX.close(m,()=>{$('#layer').innerHTML=''})} else $('#layer').innerHTML=''};
}
function confirmSubmit(){
  const un=X.ans.filter(a=>a<0).length;
  modal('답안 제출',un?`안 푼 문제가 <b>${un}문항</b> 있습니다. 그래도 제출하시겠습니까?`:'답안을 제출하시겠습니까?',[{t:'취소'},{t:'제출',pri:1,f:()=>modal('답안 제출 확인','제출하면 답안을 더 이상 바꿀 수 없습니다. 정말 제출하시겠습니까?',[{t:'취소'},{t:'최종 제출',pri:1,f:()=>submit(false)}])}]);
}
function submit(auto){
  if(X.done) return;
  X.done=true; clearInterval(tick); $('#layer').innerHTML='';
  const by={1:[0,0],2:[0,0],0:[0,0]};
  X.qs.forEach((q,k)=>{const s=q.s||0; by[s][1]++; if(X.ans[k]===q.a) by[s][0]++});
  const sc=s=>by[s][1]?Math.round(by[s][0]/by[s][1]*100):null;
  const s1=sc(1), s2=sc(2), s0=sc(0);
  const parts=[s1,s2].filter(v=>v!=null);
  const avg=parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):s0;
  const pass=parts.length===2?(s1>=40&&s2>=40&&avg>=60):avg>=60;
  X.score={s1,s2,avg,pass,ok:X.qs.filter((q,k)=>X.ans[k]===q.a).length,used:Math.min(X.total,Math.round(X.total-(X.end-Date.now())/1000))};
  // 오답 저장 (맞힌 문제는 오답 목록에서 뺌)
  X.qs.forEach((q,k)=>CS.record(q.id,X.ans[k]===q.a));
  if(!X.rev) CS.addHist({k:X.k,t:X.title,avg,pass});
  if(auto) toast('시험 시간이 끝나 답안이 자동 제출되었습니다.');
  showResult();
}
function showResult(){
  show('result'); const r=X.score;
  $('#result').innerHTML=`<div class="hbar"><div class="in gut"><h1>${esc(X.title)} 결과</h1><span class="tag">수험번호 ${X.no}</span></div></div>
  <div class="res gut">
    <div class="panel">
      <p class="big ${r.pass?'ok':'bad'}">${X.rev?r.avg+'점':r.pass?'합격':'불합격'}</p>
      <p class="note">${X.rev?'유형 연습은 합격 판정 없이 정답률만 본다. 틀린 문제는 오답 목록과 약점 분석에 반영된다.':r.s1!=null&&r.s2!=null?(r.pass?'두 과목 모두 40점 이상이고 평균 60점 이상입니다.':(Math.min(r.s1,r.s2)<40?'40점 미만인 과목이 있어 과락입니다.':'평균이 60점에 못 미칩니다.')):'60점 이상이면 통과로 표시합니다.'} 걸린 시간 ${fmt(r.used)}</p>
      <div class="score" style="margin-top:12px">
        ${r.s1!=null?`<div class="sbox"><span>1과목 컴퓨터 일반</span><b>${r.s1}</b><small>${X.rev?'':r.s1<40?'과락':'통과'}</small></div>`:''}
        ${r.s2!=null?`<div class="sbox"><span>2과목 스프레드시트 일반</span><b>${r.s2}</b><small>${X.rev?'':r.s2<40?'과락':'통과'}</small></div>`:''}
        <div class="sbox"><span>평균</span><b>${r.avg}</b><small>${X.qs.length}문항 중 ${r.ok}개 정답</small></div>
      </div>
    </div>
    <div class="panel">
      <h2>문항별 결과 <small>누르면 그 문제의 정답과 해설을 본다</small></h2>
      <div class="legend"><span class="pill ok">정답</span><span class="pill bad">오답·안 푼 문제</span></div>
      <div class="grid40" style="margin-top:10px">${X.qs.map((q,k)=>`<button class="cell ${X.ans[k]===q.a?'ok':'bad'}" type="button" data-rev="${k}" aria-label="${k+1}번 ${X.ans[k]===q.a?'정답':'오답'}">${k+1}</button>`).join('')}</div>
    </div>
    ${(()=>{const c={};X.qs.forEach((q,k)=>{if(X.ans[k]!==q.a&&q.w&&TT(q.w))c[q.w]=(c[q.w]||0)+1});const ks=Object.keys(c).sort((a,b)=>c[b]-c[a]);
      return ks.length?`<div class="panel"><h2>이번에 틀린 유형 <small>누르면 그 유형만 모아 연습한다 (정답 바로 확인)</small></h2><div class="tychips">${ks.map(w=>`<button type="button" data-ty="${w}">${esc(TT(w))} <b>${c[w]}</b></button>`).join('')}</div></div>`:''})()}
    <div class="acts2"><button class="btn pri" type="button" id="rev">정답·해설 보기</button><button class="btn" type="button" id="again">같은 시험 다시 풀기</button><button class="btn" type="button" id="wr">틀린 문제만 다시 풀기</button><button class="btn" type="button" id="hm">처음 화면</button></div>
  </div>`;
  /* 점수가 0에서 올라가며 세어짐 (시험 끝났을 때 한 번) */
  try{if(!matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('#result .sbox b').forEach(el=>{const to=+el.textContent;if(!(to>0))return;const t0=performance.now();el.textContent='0';
    const step=t=>{const p=Math.min(1,(t-t0-120)/750);const v=p<0?0:Math.round(to*(1-Math.pow(1-p,3)));el.textContent=v;if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}}catch(err){}
  document.querySelectorAll('#result .grid40 .cell').forEach((c,i)=>c.style.animationDelay=(180+i*12)+'ms');
  $('#result').onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.rev!=null){X.i=+b.dataset.rev; show('exam'); renderExam(); return}
    if(b.id==='rev'){X.i=0; show('exam'); renderExam()}
    if(b.dataset.ty){startType(b.dataset.ty);return}
    if(b.id==='again'){X.k.startsWith('t:')?startType(X.k.slice(2)):start()}
    if(b.id==='wr'){S.sel='wrong';store.set('sel','wrong');start()}
    if(b.id==='hm'){home()}};
}
/* ---------- 계산기 */
function calc(){
  if($('#calc')){$('#calc').remove();return}
  const d=document.createElement('div'); d.className='calc'; d.id='calc'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','계산기');
  d.innerHTML=`<div class="top"><span>계산기</span><button class="x" type="button" aria-label="계산기 닫기">×</button></div><div class="ex" id="cx"></div><div class="disp" id="cd">0</div>
  <div class="keys">${['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(k=>`<button type="button" class="${'÷×−+'.includes(k)?'op':k==='='?'eq':''}">${k}</button>`).join('')}</div>`;
  document.body.appendChild(d);
  let ex='';
  const upd=v=>{$('#cd').textContent=v||'0'};
  d.onclick=e=>{const b=e.target.closest('button'); if(!b) return; const k=b.textContent;
    if(b.classList.contains('x')){window.UIX?UIX.close(d,()=>d.remove()):d.remove();return}
    if(k==='C'){ex='';$('#cx').textContent='';upd('');return}
    if(k==='⌫'){ex=ex.slice(0,-1);upd(ex);return}
    if(k==='='){try{const js=ex.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-'); if(!/^[\d+\-*/().\s]+$/.test(js)) throw 0; const v=Function('"use strict";return ('+js+')')(); $('#cx').textContent=ex+' ='; ex=String(Math.round(v*1e10)/1e10); upd(ex)}catch(err){$('#cx').textContent='식을 확인하세요';}return}
    ex+=k; upd(ex)};
}
function show(id){['home','exam','result'].forEach(x=>$('#'+x).hidden=x!==id); window.scrollTo(0,0)}
home();
CS.on(w=>{if(w==='data'&&!$('#home').hidden)home()});
};
</script>
