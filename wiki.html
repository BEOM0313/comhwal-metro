<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#232a4a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)">
<title>컴활위키</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Black+Han+Sans&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* 레이아웃: 상단 고정 바 + 위키 문서. PC는 왼쪽 목차 · 가운데 문서 · 오른쪽 문제 창, 중간 폭은 문제를 문서 아래에, 모바일은 한 열 */
:root{
  --bg:#f3f5fa; --paper:#ffffff; --ink:#1d2333; --sub:#5b6478; --line:#dfe3ec;
  --acc:#3a4fd8; --acc2:#0f7a55; --acc-ink:#ffffff; --link:#2f45c7; --mark:#ffe58a; --trap:#fff4f2; --trap-line:#d9472f; --tip:#eef3ff;
  --bar:#232a4a; --bar-ink:#eef0ff; --fold:#f1f3f9; --shadow:0 10px 30px rgba(20,24,40,.18);
  --k2:#e3f4ec; --k2b:#1f7a54; --k2i:#14583b; --k3:#fbece6; --k3b:#b8532f; --k3i:#8a3519; --k4:#ecebfd; --k4b:#5a55c9; --k4i:#3b3699;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-disp:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131a; --paper:#191c27; --ink:#e7e9f2; --sub:#9aa2b8; --line:#2c3142;
  --acc:#8392ff; --acc2:#4cc79a; --acc-ink:#10132a; --link:#9fabff; --mark:#5a4a12; --trap:#2b1a1a; --trap-line:#ff7a62; --tip:#18213a;
  --bar:#0b0d14; --bar-ink:#e7e9f2; --fold:#20242f; --shadow:0 10px 30px rgba(0,0,0,.5); --k2:#173328; --k2b:#4cc69a; --k2i:#9fe5c8; --k3:#3a2219; --k3b:#f08a62; --k3i:#ffc2a8; --k4:#24234a; --k4b:#9a95ff; --k4i:#cfccff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131a; --paper:#191c27; --ink:#e7e9f2; --sub:#9aa2b8; --line:#2c3142;
  --acc:#8392ff; --acc2:#4cc79a; --acc-ink:#10132a; --link:#9fabff; --mark:#5a4a12; --trap:#2b1a1a; --trap-line:#ff7a62; --tip:#18213a;
  --bar:#0b0d14; --bar-ink:#e7e9f2; --fold:#20242f; --shadow:0 10px 30px rgba(0,0,0,.5); --k2:#173328; --k2b:#4cc69a; --k2i:#9fe5c8; --k3:#3a2219; --k3b:#f08a62; --k3i:#ffc2a8; --k4:#24234a; --k4b:#9a95ff; --k4i:#cfccff; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
a{color:var(--link)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink)}
.top .in{max-width:1640px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.homeback{color:var(--bar-ink);text-decoration:none;font-size:28px;line-height:1;display:grid;place-items:center;width:32px;height:40px;margin-right:-6px;border-radius:8px}
@media (hover:hover) and (pointer:fine){.homeback:hover{background:rgba(255,255,255,.12)}}
.logo{font-family:var(--f-disp);font-size:22px;color:var(--bar-ink);text-decoration:none;white-space:nowrap;line-height:1}
.logo span{color:var(--acc)}
.srch{flex:1;min-width:0;position:relative}
.srch input{width:100%;border:0;border-radius:8px;padding:9px 12px;font:inherit;font-size:16px;background:rgba(255,255,255,.13);color:var(--bar-ink);min-height:40px}
.srch input::placeholder{color:rgba(238,240,255,.6)}
.res{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;max-height:60vh;overflow-y:auto}
.res button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;font:inherit;font-size:14.5px;color:var(--ink);cursor:pointer;min-height:44px}
.res button.on{background:var(--fold)}
@media (hover:hover) and (pointer:fine){.res button:hover{background:var(--fold)}}
.res small{color:var(--sub)}
.tb{display:flex;gap:6px}
.tbtn{border:1px solid rgba(255,255,255,.25);background:none;color:var(--bar-ink);border-radius:8px;padding:0 12px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap;min-height:40px}
.wrap{max-width:1640px;margin:0 auto;padding-block:20px calc(48px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.layout.has-side{grid-template-columns:250px minmax(0,1fr)}.layout.has-side .side{grid-column:1;grid-row:1/span 2}.layout.has-side .doc{grid-column:2;grid-row:1}.layout.has-side .qz{grid-column:2;grid-row:2}}
@media (min-width:1360px){.layout.has-side{grid-template-columns:240px minmax(0,1fr) 380px}.layout.has-side .side{grid-row:1}.layout.has-side .qz{grid-column:3;grid-row:1;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 96px);overflow:auto;overscroll-behavior:contain}}
@media (min-width:1700px){.layout.has-side{grid-template-columns:260px minmax(0,1fr) 420px}}
/* 문제 창 */
@media (max-width:640px){#csp .cs-pill{width:40px;padding:0;justify-content:center;font-size:0;gap:0;min-height:40px}#csp .cs-pill i{width:10px;height:10px}}
.qjump{margin-left:auto;border:1px solid var(--acc);background:none;color:var(--link);border-radius:999px;font:inherit;font-size:12.5px;padding:2px 10px;cursor:pointer;min-height:28px}
@media (min-width:1360px){.qjump{display:none}}
.qz{display:none;scroll-margin-top:80px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 16px 18px;min-width:0;font-size:15px}
.layout.has-side .qz{display:block}
.qz .qh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qz .qh h2{margin:0;font-size:17px}
.qz .qh small{color:var(--sub);font-size:12.5px}
.qz .qf{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.qz .qf button{min-height:34px;border:1px solid var(--line);background:var(--fold);color:var(--ink);border-radius:999px;padding:0 11px;font:inherit;font-size:13px;cursor:pointer}
.qz .qf button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.qz .bar{height:6px;border-radius:3px;background:var(--fold);overflow:hidden;display:flex;margin:4px 0 4px}
.qz .bar i{display:block;height:100%}.qz .bar .o{background:var(--acc2)}.qz .bar .x{background:var(--trap-line)}
.qz .pg{display:flex;justify-content:space-between;color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
.qz .qcard{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
.qz .src{display:inline-block;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-bottom:8px}
.qz .src.cbt{color:var(--k3i);background:var(--k3);border-color:transparent}.qz .src.own{color:var(--k2i);background:var(--k2);border-color:transparent}
.qz .stem{font-weight:700;line-height:1.6;white-space:pre-line;margin:0 0 10px}
.qz .qfig{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#fff;margin:0 0 10px}
.qz .op{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:9px 10px;margin:0 0 7px;font:inherit;font-size:14.5px;line-height:1.5;cursor:pointer;min-height:44px}
@media (hover:hover) and (pointer:fine){.qz .op:hover:not(:disabled){border-color:var(--acc)}}
.qz .op:disabled{cursor:default}
.qz .op .m{font-family:var(--f-mono);color:var(--acc)}
.qz .op.ok{border-color:var(--acc2);background:var(--k2);color:var(--k2i)}.qz .op.ok .m{color:var(--k2i)}
.qz .op.no{border-color:var(--trap-line);background:var(--trap)}
.qz .ex{border-radius:8px;padding:10px 12px;margin-top:4px;font-size:14px;white-space:pre-line;background:var(--tip);line-height:1.65}
.qz .ex b{display:block;margin-bottom:2px}.qz .ex.ok b{color:var(--acc2)}.qz .ex.no b{color:var(--trap-line)}
.qz .ex a{font-size:13px}
.qz .nv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.qz .nv button,.qz .lockb{min-height:42px;border:1px solid var(--line);background:var(--fold);color:var(--ink);border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.qz .nv .pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.qz .lock{margin-top:12px;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--sub)}
.qz .lockb{min-height:36px;padding:0 12px;margin-top:6px;font-size:13px}
.qz details{margin-top:12px;font-size:13px}.qz summary{cursor:pointer;color:var(--sub);min-height:32px}
.qz .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.qz .chips button{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:12px var(--f-mono);cursor:pointer;padding:0}
.qz .chips button.o{background:var(--k2);border-color:var(--acc2);color:var(--k2i)}.qz .chips button.x{background:var(--trap);border-color:var(--trap-line)}
.qz .chips button.cur{outline:2px solid var(--acc);outline-offset:1px}
.qz .empty{color:var(--sub);font-size:14px;margin:12px 0 0}
.doc{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:24px clamp(16px,3.4vw,44px) 30px;min-width:0}
.side{display:none}
@media (min-width:1100px){.layout.has-side .side{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:14px}}
.side b{display:block;margin-bottom:6px;font-size:13px;color:var(--sub)}
.side ol{list-style:none;margin:0;padding:0}
.side li a{display:block;padding:4px 6px;border-radius:5px;text-decoration:none;color:var(--ink);cursor:pointer}
.side li a.on{background:var(--tip);color:var(--link);font-weight:700}
.side .sn{color:var(--acc);font-family:var(--f-mono);font-size:12px;margin-right:6px}
.side .other{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.cats{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;margin:0 0 14px}
.cats b{color:var(--sub);font-weight:500;margin-right:2px}
.cats a{text-decoration:none;cursor:pointer}
.cats a:not(:last-child)::after{content:"|";color:var(--line);margin-left:8px}
.doc h1{font-size:clamp(25px,3.2vw,32px);line-height:1.3;margin:0 0 6px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--sub);font-size:12.5px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.notice{border:1px solid var(--line);border-left:6px solid var(--acc);background:var(--tip);border-radius:4px;padding:10px 14px;margin:0 0 16px;font-size:14px}
.notice.s2{border-left-color:var(--acc2)}
.toc{display:inline-block;border:1px solid var(--line);background:var(--fold);border-radius:4px;padding:10px 18px 12px;margin:0 0 6px;font-size:14.5px;min-width:min(260px,100%)}
@media (min-width:1100px){.layout.has-side .toc{display:none}}
.toc b{display:block;margin-bottom:4px}
.toc ol{margin:0;padding:0;list-style:none}
.toc a{text-decoration:none;cursor:pointer;display:inline-block;padding:2px 0}
.toc .sn{color:var(--acc);font-family:var(--f-mono);font-size:12.5px;margin-right:6px}
.doc h2{font-size:22px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:5px;margin:30px 0 10px;display:flex;align-items:baseline;gap:8px;text-wrap:balance;scroll-margin-top:90px}
.doc h2 .sn{color:var(--acc);font-family:var(--f-mono);font-size:17px;font-weight:500}
.doc p{margin:0 0 12px;max-width:75ch}
.doc ul{margin:0 0 12px;padding-left:22px;max-width:75ch}
.doc li{margin:3px 0}
mark{background:var(--mark);color:inherit;padding:0 2px}
code{font-family:var(--f-mono);font-size:.88em;background:var(--fold);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
.wl{color:var(--link);text-decoration:none;border-bottom:1px dashed currentColor;cursor:pointer}
.tw{overflow-x:auto;margin:6px 0 14px;max-width:100%;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:14.5px;min-width:min(520px,100%)}
th,td{border:1px solid var(--line);padding:7px 10px;vertical-align:top;text-align:left}
th{background:var(--fold);font-weight:700;white-space:nowrap}
.trap{background:var(--trap);border:1px solid var(--trap-line);border-radius:4px;padding:10px 14px;margin:8px 0 14px;font-size:14.5px;max-width:75ch}
.trap::before{content:"기출 함정";display:inline-block;font-weight:700;color:var(--trap-line);margin-right:8px;font-size:12.5px;letter-spacing:.5px}
details.fold{border:1px solid var(--line);border-radius:4px;margin:8px 0 14px;background:var(--fold);max-width:75ch}
details.fold summary{cursor:pointer;padding:9px 12px;font-weight:700;font-size:14.5px;list-style:none;min-height:44px;display:flex;align-items:center;gap:8px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"[ 펼치기 · 접기 ]";color:var(--sub);font-weight:400;font-size:12.5px;margin-left:auto}
details.fold>div{padding:2px 14px 10px;font-size:15px}
sup.fn a{font-family:var(--f-mono);font-size:11.5px;text-decoration:none;color:var(--link);padding:0 2px;cursor:pointer}
.fns{border-top:1px solid var(--line);margin-top:34px;padding-top:12px;font-size:13.5px;color:var(--sub)}
.fns ol{list-style:none;padding:0;margin:0}
.fns li{margin:5px 0;display:flex;gap:8px}
.fns li a{font-family:var(--f-mono);font-size:12px;text-decoration:none;flex:none;cursor:pointer}
.fns li.hl{background:var(--mark);color:var(--ink)}
.pop{position:fixed;z-index:20;max-width:min(380px,calc(100vw - 32px));background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:12px 14px;font-size:14px;line-height:1.65}
.pop .h{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);color:var(--acc);font-size:12px;margin-bottom:4px}
.pop .x{border:0;background:none;color:var(--sub);font:inherit;font-size:20px;line-height:1;cursor:pointer;min-width:36px;min-height:36px;margin:-8px -8px -8px 0}
@media (max-width:700px){.pop{left:0!important;right:0;bottom:0;top:auto!important;max-width:none;border-radius:14px 14px 0 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}}
.nav{margin-top:26px;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:14px}
.nav .nh{background:var(--bar);color:var(--bar-ink);text-align:center;font-weight:700;padding:7px}
.nav .row{display:grid;grid-template-columns:150px minmax(0,1fr);border-top:1px solid var(--line)}
.nav .row>b{background:var(--fold);padding:7px 10px;display:flex;align-items:center}
.nav .row>div{padding:7px 10px;display:flex;flex-wrap:wrap;gap:4px 0;min-width:0}
.nav .it{white-space:nowrap}
.nav .it:not(:last-child)::after{content:"·";color:var(--sub);margin:0 8px}
.nav a{text-decoration:none;cursor:pointer}
.nav .cur{font-weight:700;color:var(--ink)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;font-size:14.5px}
.pn a{display:block;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;text-decoration:none;min-height:44px}
.pn a small{display:block;color:var(--sub);font-size:12px}
.pn .r{text-align:right}
.tabs{display:flex;gap:6px;margin:4px 0 6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:20px;padding:0 16px;font:inherit;font-size:14.5px;cursor:pointer;min-height:40px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:8px 0 18px}
.card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;background:var(--paper);color:var(--ink);text-align:left;font:inherit;min-height:64px}
@media (hover:hover) and (pointer:fine){.card:hover{border-color:var(--acc)}}
.card .n{font-family:var(--f-mono);font-size:12px;background:var(--acc);color:var(--acc-ink);border-radius:4px;padding:1px 6px;flex:none;margin-top:3px}
.card.s2 .n{background:var(--acc2)}
.card .t{font-weight:700;font-size:15px;line-height:1.4}
.card .s{display:block;font-size:12.5px;color:var(--sub);font-weight:400;margin-top:2px}
.hero{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:12px}
.hero .big{font-family:var(--f-disp);font-size:clamp(32px,6vw,52px);line-height:1.1;margin:0}
.hero .big span{color:var(--acc)}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--sub);font-size:13.5px;margin-top:8px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.gh{font-size:18px;margin:20px 0 4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.gh small{color:var(--sub);font-weight:400;font-size:13px}
@media (max-width:640px){
  .top .in{gap:8px}
  .srch{order:3;flex-basis:100%}
  .tb{margin-left:auto}
  .doc{padding-top:18px;border-radius:6px}
  .nav .row{grid-template-columns:1fr}.nav .row>b{padding:5px 10px}
  .doc h2{font-size:20px}
  body{font-size:15.5px}
}

/* 그림(도식) */
.doc{counter-reset:fig}
.fig{margin:14px 0 20px;max-width:820px}
.fig figcaption{font-size:13.5px;color:var(--sub);margin-top:8px;line-height:1.6}
.fig figcaption::before{counter-increment:fig;content:"그림 " counter(fig) ". ";font-weight:700;color:var(--ink)}
.dg{border:1px solid var(--line);border-radius:10px;background:var(--fold);padding:16px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45;overflow-x:auto}
.dg .bx{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:9px 12px;text-align:center;min-width:0}
.dg .bx b{display:block;font-size:15px}
.dg .bx small{display:block;color:var(--sub);font-size:12.5px}
.dg .grp{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dg .gt{text-align:center;font-weight:700;font-size:15px;margin-bottom:2px}
.dg .k2{background:var(--k2);border-color:var(--k2b)} .dg .k2 .gt,.dg .bx.k2 b{color:var(--k2i)}

const FIG={
'd8':{'시스템 소프트웨어':`<figure class="fig" role="img" aria-label="소프트웨어는 시스템과 응용으로 나뉘고, 운영체제는 제어 프로그램과 처리 프로그램으로 이루어진다">
<div class="dg">
 <div class="bx">소프트웨어</div>

 <div class="row2">
  <div class="bx k4"><b>시스템 소프트웨어</b><small>컴퓨터 자체를 관리</small></div>
  <div class="bx"><b>응용 소프트웨어</b><small>한글, 엑셀, 게임</small></div>
 </div>
 <div class="ar left">↓ 대표가 운영체제</div>
 <div class="grp k4"><div class="gt">운영체제 = 제어 + 처리</div>
  <div class="row2">
   <div class="grp k2"><div class="gt">제어 프로그램 (관리자)</div><div class="bx">감시 프로그램 (핵심)</div><div class="bx">작업 관리 프로그램</div><div class="bx">데이터 관리 프로그램</div></div>

 </div>

'd2':{'제어장치':`<figure class="fig" role="img" aria-label="명령이 주기억장치에서 MAR과 MBR을 거쳐 제어장치의 IR, 해독기, 부호기로 가고 연산장치가 계산한다">

     <div class="chainv"><div class="bx">PC <small>다음에 할 명령 주소</small></div><div class="av">↓ 꺼내 옴</div><div class="bx">IR <small>지금 하는 명령</small></div><div class="av">↓</div><div class="bx">해독기 <small>무슨 명령인지 풀기</small></div><div class="av">↓</div><div class="bx">부호기 <small>각 장치에 신호 보내기</small></div></div></div>
    <div class="grp k3"><div class="gt">연산장치 (계산)</div>
     <div class="chainv"><div class="bx">가산기 <small>덧셈</small></div><div class="bx">보수기 <small>뺄셈을 덧셈으로</small></div><div class="bx">누산기 <small>결과를 잠시 저장</small></div><div class="bx">상태 레지스터 <small>부호·오버플로</small></div></div></div>
   </div>
  </div>
 </div>
</div>

'd5':{'한눈에 보기':`<figure class="fig" role="img" aria-label="기억장치 계층: 위로 갈수록 빠르고 비싸며 작다. 캐시는 CPU와 주기억 사이 속도를 메우고, 가상 메모리는 보조기억을 빌려 용량을 늘린다">

 <div class="pyr-wrap">

'd7':{'자료 구성 단위':`<figure class="fig" role="img" aria-label="Bit에서 Nibble, Byte, Word, Field, Record, File, Database 순으로 커진다">

</div></div>

'd9':{'운영 방식':`<figure class="fig" role="img" aria-label="다중 프로그래밍은 CPU 하나가 여러 프로그램을 번갈아 처리하고, 다중 처리는 CPU 여러 개가 동시에 처리한다">
